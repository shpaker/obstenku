<svg xmlns="http://www.w3.org/2000/svg" width="200" height="130" viewBox="0 0 200 130">
<style>
.wall{fill:#9aa3ad}.ghost{fill:none;stroke:#6b7280;stroke-dasharray:3 3}
.box{fill:#2f6fd6}.path{fill:none;stroke:#6b7280;stroke-dasharray:4 3}
.move{fill:none;stroke:#2f6fd6;stroke-width:2}.met{fill:#e0a526}
text{font:12px sans-serif;fill:#374151}
@media (prefers-color-scheme:dark){.wall{fill:#4b5563}.ghost,.path{stroke:#9ca3af}
.box{fill:#5b9bff}.move{stroke:#5b9bff}text{fill:#d1d5db}}
</style>
<rect class="wall" x="120" y="10" width="20" height="100"/>
<rect class="ghost" x="20" y="20" width="20" height="20"/>
<rect class="ghost" x="160" y="70" width="20" height="20"/>
<line class="path" x1="30" y1="30" x2="170" y2="80"/>
<polyline class="move" points="30,30 110,58.57 110,80"/>
<rect class="box" x="100" y="70" width="20" height="20"/>
<text x="10" y="125">Slide: rubs along the wall</text>
</svg>
