run:
  timeout: 5m
  tests: true

linters-settings:
  goimports:
    local-prefixes: github.com/shpaker/obstenku
  misspell:
    locale: US
  # obstenku is pure geometry: no engine, no IO (see AGENTS.md)
  depguard:
    rules:
      core:
        list-mode: strict
        files:
          - "$all"
        allow:
          - $gostd
          - github.com/shpaker/obstenku
        deny:
          - pkg: os
            desc: obstenku does no IO
          - pkg: syscall/js
            desc: obstenku knows no platform

linters:
  disable-all: true
  enable:
    - depguard
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - typecheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
